# Local testing services for generated go-scaffolder applications.
#
# Not used by the compile-only smoke runner — that just runs `go build`.
# This compose file is for MANUAL runtime testing of individual generated
# services. Bring up only what you need:
#
#   docker compose up -d postgres redis        # for an api+postgres+redis combo
#   docker compose up -d mysql                 # for a mysql combo
#   docker compose down -v                     # teardown + delete volumes
#
# All credentials use admin/admin per request. NEVER use these in any
# environment that isn't your laptop.
#
# Combos NOT covered by this file: couchbase. Add an equivalent service here
# when you need it.

services:
  postgres:
    image: postgres:16-alpine
    container_name: go-scaffolder-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: go-scaffolder-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: appdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uadmin", "-padmin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: go-scaffolder-redis
    command: ["redis-server", "--requirepass", "admin"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: go-scaffolder-kafka
    # KRaft mode — no zookeeper. Single node acting as both broker and
    # controller, which is all an integration run needs.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node, so every replication factor has to be 1 — the defaults are
      # 3 and the broker refuses to create its internal topics otherwise.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Consumers in a test should not wait out the default 3s rebalance delay.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The scaffold subscribes to a topic it never creates, and the test
      # produces to it. Auto-create keeps both sides from needing a setup step.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: go-scaffolder-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      # Management API — the integration suite publishes test messages through
      # it rather than shipping an AMQP client just to inject one message.
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15

volumes:
  postgres_data:
  mysql_data:
  redis_data:

# DSN / addr cheatsheet for generated services (see config.go.tmpl):
#
#   gorm-postgres:
#     DATABASE_DSN="host=localhost user=admin password=admin dbname=appdb port=5432 sslmode=disable"
#
#   gorm-mysql:
#     DATABASE_DSN="admin:admin@tcp(localhost:3306)/appdb?parseTime=true&loc=Local"
#
#   redis cache (Cache=redis):
#     REDIS_ADDR=localhost:6379
#     REDIS_PASSWORD=admin
#     REDIS_DB=0
#
#   redis broker (Broker=redis):
#     BROKER_REDIS_ADDR=localhost:6379
#     BROKER_REDIS_PASSWORD=admin
#     BROKER_REDIS_DB=1
#
#   kafka broker (Broker=kafka):
#     KAFKA_BROKERS=localhost:9092
#     KAFKA_TOPIC=orders
#     KAFKA_CONSUMER_GROUP=orders-consumer
#
#   rabbitmq broker (Broker=rabbitmq):
#     RABBITMQ_URL=amqp://admin:admin@localhost:5672/
#     KAFKA_TOPIC=orders            # doubles as exchange name and routing key
#     KAFKA_CONSUMER_GROUP=orders   # doubles as the queue name
